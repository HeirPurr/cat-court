services:
  - type: web
    name: cat-court
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KIMI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: KIMI_MODEL
        value: moonshot-v1-8k
      - key: DB_PATH
        value: /var/data/cat_court.db
      - key: KIMI_API_KEY
        sync: false
    disk:
      name: cat-court-data
      mountPath: /var/data
      sizeGB: 1
